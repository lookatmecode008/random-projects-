<!doctype html>
<html lang="en" id="register-body">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#20242c">

    <title>Records</title>
  </head>
  
  <body class="app-shell">
      <header class="topbar records-header">
            <img src="./Logo Zoom.jpeg"/>
            <div class="brand-copy">
              <span class="brand-name">Are Aganeng NPO</span>
              <span class="brand-subtitle">STAFF REGISTER</span>
            </div>
          
      </header>
<div class="day-record brand-copy">
    <h2>Today: <span id="today"></span></h2>
    <table>
      <thead>
        <tr>
          <td>Name</td>
          <td>Department</td>
          <td>Clock In</td>
          <td>Clock Out</td>
        </tr>
      </thead>
      <tbody id="insertEntry"></tbody>
      <div class="register-buttons action-buttons">
        <button class="button downloadReg" onclick="exportData()">Download Attendance Record</button>
        <button class="button eraseReg" onclick="removeAttendanceData()">Erase Attendance Record</button>
      </div>
    </table>
</div>
    <script>
  const container = document.querySelector("#insertEntry");
  const attendanceData = JSON.parse(localStorage.getItem("attendanceRegister")) || [];

  const todayDate = new Date().toISOString().split('T')[0];
  
  document.getElementById("today").innerText = todayDate;

  // Clear container
  container.innerHTML = "";

  // This is where you use textContent to dictate what element goes where
attendanceData.sort((a, b) => a.date.localeCompare(b.date));
  
  let currentDate="";

  attendanceData.forEach((emp) => {
      if (emp.date !== currentDate) {
    currentDate = emp.date;

    const dateRow = document.createElement("tr");
    const dateTd = document.createElement("td");

    dateTd.textContent = currentDate;
    dateTd.colSpan = 4;

    dateRow.appendChild(dateTd);
    container.appendChild(dateRow);
  }
    const row = document.createElement("tr");

    const nameTd = document.createElement("td");
    nameTd.textContent = `${emp.name} ${emp.surname}`;

    const deptTd = document.createElement("td");
    deptTd.textContent = emp.department;

    const idTd = document.createElement("td");
    idTd.textContent = emp.Id;

    const inTd = document.createElement("td");
    inTd.textContent = emp.clockIn;

    const outTd = document.createElement("td");
    outTd.textContent = emp.clockOut || "—";

    row.append(nameTd, deptTd,  inTd, outTd);
    container.appendChild(row);
  });


  function exportData(){
      //bc localStorage doesnt store persistent data across devices
     
    const dataForExport = JSON.stringify(attendanceData)
    const exportFile = new Blob (
         [dataForExport], 
        {type:"text/csv"})
        
    const downloadURL = URL.createObjectURL(exportFile);

    const downloadLink = document.createElement("a");

    downloadLink.href = downloadURL;
    downloadLink.download = "attendance-backup.json";

    downloadLink.click();

    URL.revokeObjectURL(downloadURL);
    }
    
    function removeAttendanceData(){
        // bc localStorage wont clear itself
        const note = confirm("Are you sure?")
        if(note){
          const exported = confirm("Please ensure that the data has been exported before continuing")
          if(!exported){
            exportData()
          }else{localStorage.removeItem("attendanceRegister")
        alert("Data cleared! Refresh to continue")}
        }
    }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then((registration) => {
          console.log("PWA registered:", registration.scope);
        })
        .catch((error) => {
          console.error("PWA registration failed:", error);
        });
    });
  }
</script>
  </body>
</html>
